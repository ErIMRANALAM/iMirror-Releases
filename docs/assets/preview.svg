<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative iMirror app preview</title>
  <desc id="desc">A conceptual macOS iMirror window beside a sample Android home screen. The device image is illustrative, not a live phone screenshot.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dcecff"/><stop offset="1" stop-color="#e8e1ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#365fc7"/><stop offset="1" stop-color="#7d62e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#263454" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="38" fill="url(#backdrop)"/>
